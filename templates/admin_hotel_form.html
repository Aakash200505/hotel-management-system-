{% extends 'base.html' %}
{% block title %}Hotel Form{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="glass-card p-4">
                <h3 class="brand-font mb-3">{{ 'Add Hotel' if mode == 'add' else 'Edit Hotel' }}</h3>
                <form method="post" enctype="multipart/form-data">
                    <div class="row">
                        <div class="col-md-6 mb-3"><label class="form-label">Hotel Name</label><input class="form-control" name="name" value="{{ hotel.name if hotel else '' }}" required></div>
                        <div class="col-md-6 mb-3"><label class="form-label">Location</label><input class="form-control" name="location" value="{{ hotel.location if hotel else '' }}" required></div>
                    </div>
                    <div class="mb-3"><label class="form-label">Address</label><input class="form-control" name="address" value="{{ hotel.address if hotel else '' }}" required></div>
                    <div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" rows="3" name="description" required>{{ hotel.description if hotel else '' }}</textarea></div>
                    <div class="mb-3"><label class="form-label">Amenities (comma-separated)</label><input class="form-control" name="amenities" value="{{ hotel.amenities if hotel else '' }}"></div>
                    <div class="row">
                        <div class="col-md-6 mb-3"><label class="form-label">Base Price/Night</label><input class="form-control" type="number" step="0.01" name="price_per_night" value="{{ hotel.price_per_night if hotel else '' }}" required></div>
                        <div class="col-md-6 mb-3"><label class="form-label">Rating</label><input class="form-control" type="number" step="0.1" min="0" max="5" name="rating" value="{{ hotel.rating if hotel else '4.0' }}" required></div>
                    </div>
                    <div class="mb-3"><label class="form-label">Hotel Image</label><input class="form-control" type="file" name="image" accept=".png,.jpg,.jpeg,.webp"></div>
                    <button class="btn btn-gradient" type="submit">Save Hotel</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
