{% extends 'base.html' %}
{% block title %}Payment{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="glass-card p-4">
                <h3 class="brand-font">Dummy Payment Gateway</h3>
                <p>Booking #{{ booking.id }} | Amount: <strong>₹{{ '%.2f'|format(booking.total_price) }}</strong></p>
                <form method="post" class="d-flex gap-2">
                    <button class="btn btn-success w-100" name="payment_action" value="success" type="submit">Simulate Success</button>
                    <button class="btn btn-danger w-100" name="payment_action" value="failed" type="submit">Simulate Failure</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
