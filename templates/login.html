{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="glass-card p-4">
                <h3 class="mb-3 brand-font">Welcome Back</h3>
                <form method="post">
                    <div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div>
                    <div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div>
                    <button class="btn btn-gradient w-100" type="submit">Login</button>
                </form>
                <p class="mt-3 mb-0">No account? <a href="{{ url_for('register') }}">Register</a></p>
                <small class="text-muted d-block mt-2">Admin demo: admin@hotel.com / admin123</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
